<style>
:root{
  --fond:#f6f2ea; --carte:#fffdf8; --encre:#18233f; --doux:#5b6478; --trait:#e1d9c8; --creux:#f0ebdf;
  --bleu:#1f3a8a; --bleu-c:#e8edfb; --rouge:#b3261e; --rouge-c:#fbe9e7; --vert:#1f7a4d; --vert-c:#e3f4ea; --or:#8a5a00; --or-c:#fbf0d9;

}
@media (prefers-color-scheme:dark){:root{
  --fond:#0f1424; --carte:#171e33; --encre:#eef0f7; --doux:#a0a9c0; --trait:#2a3350; --creux:#1d2540;
  --bleu:#9bb0ff; --bleu-c:#1d2750; --rouge:#ff8a80; --rouge-c:#3a1d22; --vert:#6fd6a2; --vert-c:#14301f; --or:#f0c36d; --or-c:#33280f;
  --ombre:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:16px/1.55 var(--sans)}
body::before{content:"";display:block;height:6px;background:linear-gradient(90deg,#1f3a8a 0 33.3%,#fff 33.3% 66.6%,#b3261e 66.6%)}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(1.7rem,4.5vw,2.6rem)} h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0 0 .8em} a{color:var(--bleu)}
.cadre{max-width:1000px;margin:0 auto;padding:0 16px}
.entete{background:var(--carte);border-bottom:1px solid var(--trait)}
.entete .cadre{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.marque{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.marque svg{width:34px;height:34px;flex:none}
.marque b{font-family:var(--serif);font-size:1.05rem;display:block;line-height:1.2}
.marque small{color:var(--doux);font-size:.8rem}
.entete nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}

main{padding-top:22px;padding-bottom:50px;min-height:60vh}
footer{border-top:1px solid var(--trait);color:var(--doux);font-size:.85rem;padding:18px 0 30px}

.carte>h2:first-child,.carte>h3:first-child{margin-top:0}

.hero{padding:10px 0 18px}
.pastille{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:99px;font-size:.85rem;font-weight:600;background:var(--creux);border:1px solid var(--trait)}
.pastille::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--doux)}
.pastille.candidatures{background:var(--bleu-c);color:var(--bleu)} .pastille.candidatures::before{background:var(--bleu)}
.pastille.vote{background:var(--vert-c);color:var(--vert)} .pastille.vote::before{background:var(--vert);animation:pouls 1.6s infinite}
.pastille.attente{background:var(--or-c);color:var(--or)} .pastille.attente::before{background:var(--or)}
.pastille.clos{background:var(--rouge-c);color:var(--rouge)} .pastille.clos::before{background:var(--rouge)}
@keyframes pouls{50%{opacity:.3}}
.grille{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}
.grille.deux{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.principe{border-left:4px solid var(--bleu);padding:2px 0 2px 14px}
.principe:nth-child(3n+2){border-color:var(--rouge)} .principe:nth-child(3n){border-color:var(--or)}
.principe h3{font-size:1.02rem;margin-bottom:.25em} .principe p{margin:0;color:var(--doux);font-size:.95rem}
ul.puces{margin:.3em 0 .8em;padding-left:1.15em} ul.puces li{margin:.25em 0}
.cols h3{display:flex;align-items:center;gap:8px}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--creux);border:1px solid var(--trait);white-space:nowrap}
.badge.bleu{background:var(--bleu-c);color:var(--bleu);border-color:transparent} .badge.vert{background:var(--vert-c);color:var(--vert);border-color:transparent}

.etapes li small{color:var(--doux)}
label.champ{display:block;font-weight:600;font-size:.9rem;margin-bottom:12px}
input[type=text],input[type=password],input[type=datetime-local],input[type=number],select,textarea{width:100%;font:inherit;color:inherit;background:var(--carte);border:1.5px solid var(--trait);border-radius:10px;padding:10px 12px;margin-top:4px}

@media (prefers-color-scheme:dark){.bouton{color:#0f1424}}

/* candidats et bulletin */
.cand{border:1px solid var(--trait);border-radius:12px;padding:12px 14px;background:var(--creux)}
.cand b{font-family:var(--serif)} .cand p{margin:.35em 0 0;font-size:.93rem;color:var(--doux)}
fieldset.rub{border:1px solid var(--trait);border-radius:12px;padding:6px 14px 14px;margin:0 0 16px}

/* tableaux & barres */
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--trait);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--doux)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.elu td{background:var(--vert-c)} tr.elu td:first-child{font-weight:700}
.tableau{overflow-x:auto}
.barre{height:10px;border-radius:99px;background:var(--creux);overflow:hidden;border:1px solid var(--trait);min-width:80px}
.barre i{display:block;height:100%;background:var(--bleu)}
.barre.vert i{background:var(--vert)}
.onglets{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--trait);margin-bottom:20px}
.onglets button{font:600 .95rem var(--sans);background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--doux);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.onglets button[aria-selected=true]{color:var(--bleu);border-bottom-color:var(--bleu)}
.puce-eleve{display:inline-block;margin:3px 4px 3px 0;padding:3px 10px;border-radius:99px;font-size:.88rem;border:1px solid var(--trait);background:var(--creux)}
.puce-eleve.a-vote{background:var(--vert-c);color:var(--vert);border-color:transparent}
.puce-eleve.a-vote::before{content:"✔ "}
.chiffre{font:700 2.4rem/1 var(--serif)}
.statistiques{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.statistiques>div{background:var(--creux);border-radius:12px;padding:14px}
.statistiques small{color:var(--doux);display:block}
.ed-classe{border:1px solid var(--trait);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--carte)}
.ed-classe textarea{min-height:170px;font:.9rem/1.45 ui-monospace,Consolas,monospace}
details.plie{border:1px solid var(--trait);border-radius:12px;padding:10px 14px;margin:12px 0}
details.plie summary{cursor:pointer;font-weight:600}
dialog{border:1px solid var(--trait);border-radius:14px;background:var(--carte);color:var(--encre);padding:22px;max-width:min(680px,94vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,28,.62)}
.occupe{cursor:progress} .occupe::after{content:"";position:fixed;top:6px;left:0;height:3px;width:100%;background:var(--bleu);animation:charge 1s infinite;z-index:99}
@keyframes charge{0%{transform:scaleX(0);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}51%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
.demo{background:var(--or-c);color:var(--or);text-align:center;font-size:.88rem;padding:6px 12px}
.sr{position:absolute;left:-9999px}
#impr{display:none}
.carte-code{border:1.5px dashed #888;border-radius:8px;padding:10px 12px;break-inside:avoid;font-size:.85rem;color:#000;background:#fff}
.carte-code .code{font:700 1.5rem ui-monospace,Consolas,monospace;letter-spacing:.14em;margin:6px 0}
@media print{
  body::before,.entete,footer,.demo,.noprint,.onglets,dialog{display:none!important}
  body{background:#fff;color:#000;font-size:11pt} .carte{box-shadow:none;border-color:#999;break-inside:avoid}
  body[data-impr=codes] main{display:none} body[data-impr=codes] #impr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  body[data-impr=codes] #impr h2{grid-column:1/-1;margin:14px 0 4px;break-after:avoid}
  .tableau{overflow:visible}
}
@media (max-width:560px){main{padding-top:14px} .carte{padding:15px} .code-saisie{font-size:1.3rem}}

<body>
<div id="bandeauDemo"></div>
<header class="entete"><div class="cadre">
  <a class="marque" href="#" data-act="accueil" aria-label="Accueil">
    <svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#1f3a8a"/><path d="M8 16h18v11H8z" fill="#fff"/><rect x="10" y="19" width="14" height="2.4" rx="1.2" fill="#1f3a8a"/><path d="M13 6.5h8v11h-8z" fill="#fbf0d9" stroke="#b3261e" stroke-width="1.6"/></svg>
    <span><b id="titreSite">Élection des délégués</b><small id="sousTitre"></small></span></a>
  <nav id="nav"></nav>
</div></header>
<main class="cadre" id="app" aria-live="polite"></main>
<footer><div class="cadre"><span>Aucun nom d’élève n’est publié sur ce site : la liste reste dans le classeur privé de l’enseignant.</span><button class="lien" data-act="profEntree">Espace enseignant</button></div></footer>
<div id="impr"></div>

<script>
/* =================== À RENSEIGNER APRÈS LE DÉPLOIEMENT DU SCRIPT GOOGLE =================== */
const URL_SCRIPT = '';     // ex. 'https://script.google.com/macros/s/AKfycbx8jLinCtBmfhQJKO25X_t-kBzL1hkSamVleX6Yekoo-lA1rMFlfix5Z7kzVeZ_sN1C/exec'  — vide = mode démonstration (dans ce navigateur seulement)
/* ========================================================================================== */
const DEMO = !URL_SCRIPT;

/* =====================================================================
   MOTEUR DE L'ÉLECTION
   Même code pour le serveur Google (Code.gs) et le mode démonstration
   du navigateur. Il ne connaît le stockage que par l'objet « env ».
   ===================================================================== */
function creerMoteur(env) {
  const ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // 31 signes, sans I L O 0 1
  const B = ALPHA.length;
  const MUTANTES = { candidater: 1, retirer: 1, voter: 1, a_classes: 1, a_reglages: 1, a_forcer: 1, a_candidat: 1, a_tour: 1, a_reinit: 1 };

  const ERR = m => { const e = new Error(m); e.metier = true; return e; };
  const maintenant = () => env.maintenant();
  const propre = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  const cle = s => propre(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const unique = a => Array.from(new Set((Array.isArray(a) ? a : []).map(String)));
  const melanger = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(env.hasard() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };

  /* ---------- configuration ---------- */
  function cfgDefaut() {
    const d = new Date(maintenant()), y = d.getFullYear();
    return { titre: 'Élection des délégués de classe', etab: '', annee: d.getMonth() >= 7 ? y + '-' + (y + 1) : (y - 1) + '-' + y,
      dates: {}, forcer: null, tour: 1, tours: [{ n: 1, D: null, A: null }], adjDiff: false, cids: [], cseq: 0, eseq: 0 };
  }
  function cfg() { let c = env.lire('cfg'); if (!c) { c = cfgDefaut(); env.ecrire('cfg', c); } return c; }
  const sauverCfg = c => env.ecrire('cfg', c);
  const lireClasse = cid => env.lire('c' + cid);
  const sauverClasse = cl => env.ecrire('c' + cl.cid, cl);
  const toutesClasses = c => c.cids.map(x => lireClasse(x.cid)).filter(Boolean);
  const aDesVotes = c => toutesClasses(c).some(cl => Object.keys(cl.emarge || {}).some(k => cl.emarge[k].length));

  function etatDe(c, t) {
    if (c.forcer) return c.forcer;
    const d = c.dates || {};
    if (!d.debutCand || t < d.debutCand) return 'preparation';
    if (d.debutVote && t >= d.debutVote) return (d.finVote && t >= d.finVote) ? 'clos' : 'vote';
    if (!d.finCand || t < d.finCand) return 'candidatures';
    return 'attente';
  }

  /* ---------- codes personnels : 2 signes de classe + 6 au hasard ---------- */
  const enc = cid => ALPHA[Math.floor(cid / B)] + ALPHA[cid % B];
  function nouveauCode(cid, deja) {
    let code;
    do { code = enc(cid); for (let i = 0; i < 6; i++) code += ALPHA[Math.floor(env.hasard() * B)]; } while (deja.has(code));
    return code;
  }
  function trouver(codeBrut) {
    const code = String(codeBrut || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    let r = null;
    if (code.length === 8) {
      const a = ALPHA.indexOf(code[0]), b = ALPHA.indexOf(code[1]);
      if (a >= 0 && b >= 0) {
        const cl = lireClasse(a * B + b);
        const el = cl && cl.eleves.find(e => e.code === code);
        if (el) r = { cl, el };
      }
    }
    if (!r) { env.pause(900); throw ERR('Code inconnu. Recopie les 8 signes de ta fiche (lettres et chiffres).'); }
    return r;
  }

  /* ---------- listes de candidats ---------- */
  function liste(cl, tr, sec) {                       // null = rubrique non votée à ce tour
    const r = tr[sec];
    if (Array.isArray(r) && !r.length) return null;
    return Object.keys(cl.cand).filter(id => cl.cand[id].roles.indexOf(sec) >= 0 && (!r || r.indexOf(id) >= 0));
  }
  const ouverte = l => !!(l && l.length);
  const eleveDe = (cl, id) => cl.eleves.find(e => e.id === id);
  const candidatsVue = cl => cl.eleves.filter(e => cl.cand[e.id]).map(e => ({ id: e.id, nom: e.nom, groupe: cl.groupes[e.g], roles: cl.cand[e.id].roles, texte: cl.cand[e.id].texte }))
    .sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));

  function vueEleve(c, cl, el) {
    const t = maintenant(), etat = etatDe(c, t), tr = c.tours[c.tour - 1];
    const aVote = ((cl.emarge || {})[c.tour] || []).indexOf(el.id) >= 0;
    const v = { ok: true, eleve: { nom: el.nom, classe: cl.nom, groupe: cl.groupes[el.g] }, groupes: cl.groupes, etat, titre: c.titre, etab: c.etab, annee: c.annee, dates: c.dates,
      tour: c.tour, adjDiff: c.adjDiff, maintenant: t, candidats: candidatsVue(cl), moi: cl.cand[el.id] || null, aVote };
    if (etat === 'vote' && !aVote) {
      v.sections = {};
      ['D', 'A'].forEach(sec => {
        const l = liste(cl, tr, sec);
        v.sections[sec] = l && l.map(id => { const e = eleveDe(cl, id); return { id, nom: e.nom, groupe: cl.groupes[e.g], g: e.g, texte: cl.cand[id].texte }; });
      });
      v.scrutin = ouverte(v.sections.D) || ouverte(v.sections.A);
    }
    return v;
  }

  /* ---------- attribution des sièges ---------- */
  // pool : candidats triés par voix décroissantes ; diff : les 2 élus de groupes différents
  function choisir(pool, diff) {
    const res = { elus: [], egalite: null };
    let reste = pool.filter(x => x.v > 0);
    while (res.elus.length < 2 && reste.length) {
      let eligibles = reste;
      if (diff && res.elus.length === 1) { const g0 = pool.find(x => x.id === res.elus[0]).g; eligibles = reste.filter(x => x.g !== g0); }
      if (!eligibles.length) break;
      const max = eligibles[0].v, G = eligibles.filter(x => x.v === max), restants = 2 - res.elus.length;
      const compatible = diff ? (G.length === 1 || (res.elus.length === 0 && G.length === 2 && G[0].g !== G[1].g)) : G.length <= restants;
      if (compatible) { G.forEach(x => res.elus.push(x.id)); reste = reste.filter(x => G.indexOf(x) < 0); }
      else { res.egalite = { places: diff && res.elus.length === 0 ? 1 : restants, candidats: G.map(x => x.id) }; break; }
    }
    return res;
  }

  function calculer(cl, c, n) {
    const tr = c.tours[n - 1];
    const urne = env.lireUrne('u' + n + '_' + cl.cid) || [];
    const em = ((cl.emarge || {})[n] || []).length;
    const R = { cid: cl.cid, nom: cl.nom, inscrits: cl.eleves.length, emarges: em, bulletins: urne.length, coherent: urne.length === em, scrutin: false, D: null, A: null };
    let elusD = [];
    ['D', 'A'].forEach(sec => {
      const ids = liste(cl, tr, sec);
      if (!ouverte(ids)) return;
      R.scrutin = true;
      const k = sec.toLowerCase(), compte = {}; let blancs = 0;
      ids.forEach(id => compte[id] = 0);
      urne.forEach(b => { const l = b[k] || []; if (!l.length) blancs++; l.forEach(id => { if (id in compte) compte[id]++; }); });
      const cands = ids.map(id => { const e = eleveDe(cl, id); return { id, nom: e.nom, groupe: cl.groupes[e.g], g: e.g, v: compte[id], pct: urne.length ? compte[id] / urne.length : 0, elu: false, deja: false }; });
      cands.sort((a, b) => b.v - a.v || a.nom.localeCompare(b.nom, 'fr'));
      if (sec === 'A') cands.forEach(x => { x.deja = elusD.indexOf(x.id) >= 0; });
      const pool = sec === 'A' ? cands.filter(x => !x.deja) : cands;
      const sel = choisir(pool, sec === 'D' || c.adjDiff);
      cands.forEach(x => { x.elu = sel.elus.indexOf(x.id) >= 0; });
      if (sec === 'D') elusD = sel.elus;
      R[sec] = { candidats: cands, blancs, elus: sel.elus,
        egalite: sel.egalite ? { places: sel.egalite.places, candidats: sel.egalite.candidats.map(id => cands.find(x => x.id === id)) } : null,
        provisoire: sec === 'A' && !!(R.D && R.D.egalite) };
    });
    return R;
  }

  /* ---------- validations ---------- */
  function validerRoles(r) {
    const s = String(r || '');
    const out = (s.indexOf('D') >= 0 ? 'D' : '') + (s.indexOf('A') >= 0 ? 'A' : '');
    if (!out) throw ERR('Choisis au moins un rôle : délégué ou adjoint.');
    return out;
  }
  function validerTexte(t) {
    const s = propre(t);
    if (s.length > 300) throw ERR('Ton texte dépasse 300 caractères.');
    return s;
  }
  function verifierMdp(req) {
    if (!env.mdp || env.mdp === 'changez-moi') throw ERR('Le script n’est pas configuré : changez MOT_DE_PASSE au début de Code.gs, puis redéployez.');
    if (!req.mdp || String(req.mdp) !== String(env.mdp)) { env.pause(1500); throw ERR('Mot de passe incorrect.'); }
  }

  /* ---------- actions publiques ---------- */
  const ACTIONS = {};
  ACTIONS.info = () => {
    const c = cfg(), t = maintenant();
    return { ok: true, etat: etatDe(c, t), titre: c.titre, etab: c.etab, annee: c.annee, dates: c.dates, tour: c.tour, maintenant: t };
  };
  ACTIONS.connexion = req => { const c = cfg(), r = trouver(req.code); return vueEleve(c, r.cl, r.el); };
  ACTIONS.candidater = req => {
    const c = cfg();
    if (etatDe(c, maintenant()) !== 'candidatures') throw ERR('Les candidatures ne sont pas ouvertes.');
    const r = trouver(req.code);
    r.cl.cand[r.el.id] = { roles: validerRoles(req.roles), texte: validerTexte(req.texte) };
    sauverClasse(r.cl);
    return vueEleve(c, r.cl, r.el);
  };
  ACTIONS.retirer = req => {
    const c = cfg();
    if (etatDe(c, maintenant()) !== 'candidatures') throw ERR('Les candidatures ne sont plus modifiables.');
    const r = trouver(req.code);
    delete r.cl.cand[r.el.id];
    sauverClasse(r.cl);
    return vueEleve(c, r.cl, r.el);
  };
  ACTIONS.voter = req => {
    const c = cfg();
    if (etatDe(c, maintenant()) !== 'vote') throw ERR('Le vote n’est pas ouvert.');
    const r = trouver(req.code), cl = r.cl, el = r.el, n = c.tour, tr = c.tours[n - 1];
    cl.emarge = cl.emarge || {};
    const dejaEm = cl.emarge[n] || [];
    if (dejaEm.indexOf(el.id) >= 0) throw ERR('Tu as déjà voté : un seul bulletin par élève.');
    const LD = liste(cl, tr, 'D'), LA = liste(cl, tr, 'A');
    if (!ouverte(LD) && !ouverte(LA)) throw ERR('Il n’y a pas de vote pour ta classe à ce tour.');
    const d = unique(req.delegues), a = unique(req.adjoints);
    if (d.length && !ouverte(LD)) throw ERR('Pas de vote pour les délégués à ce tour.');
    if (a.length && !ouverte(LA)) throw ERR('Pas de vote pour les adjoints à ce tour.');
    if (d.length > 2 || a.length > 2) throw ERR('Au plus deux noms par rubrique.');
    d.forEach(id => { if (LD.indexOf(id) < 0) throw ERR('Un nom choisi n’est pas candidat délégué.'); });
    a.forEach(id => { if (LA.indexOf(id) < 0) throw ERR('Un nom choisi n’est pas candidat adjoint.'); });
    if (d.length === 2 && eleveDe(cl, d[0]).g === eleveDe(cl, d[1]).g) throw ERR('Les deux délégués doivent venir de deux groupes différents.');
    if (c.adjDiff && a.length === 2 && eleveDe(cl, a[0]).g === eleveDe(cl, a[1]).g) throw ERR('Les deux adjoints doivent venir de deux groupes différents.');
    // l'urne d'abord (sans nom ni date, mélangée à chaque dépôt), puis l'émargement
    const k = 'u' + n + '_' + cl.cid, urne = env.lireUrne(k) || [];
    urne.push({ d, a });
    env.ecrireUrne(k, melanger(urne));
    dejaEm.push(el.id);
    cl.emarge[n] = dejaEm;
    sauverClasse(cl);
    return { ok: true };
  };

  /* ---------- actions de l'enseignant ---------- */
  ACTIONS.a_etat = () => {
    const c = cfg(), t = maintenant(), tr = c.tours[c.tour - 1];
    const classes = toutesClasses(c).map(cl => ({
      cid: cl.cid, nom: cl.nom, groupes: cl.groupes,
      scrutin: ouverte(liste(cl, tr, 'D')) || ouverte(liste(cl, tr, 'A')),
      eleves: cl.eleves.map(e => ({ id: e.id, nom: e.nom, g: e.g, code: e.code, votes: Object.keys(cl.emarge || {}).filter(k => cl.emarge[k].indexOf(e.id) >= 0).map(Number) })),
      cand: Object.keys(cl.cand).map(id => ({ id, roles: cl.cand[id].roles, texte: cl.cand[id].texte }))
    }));
    return { ok: true, etat: etatDe(c, t), maintenant: t, verrou: aDesVotes(c),
      config: { titre: c.titre, etab: c.etab, annee: c.annee, dates: c.dates, forcer: c.forcer, tour: c.tour, tours: c.tours, adjDiff: c.adjDiff }, classes };
  };

  ACTIONS.a_classes = req => {
    const c = cfg();
    if (aDesVotes(c)) throw ERR('Des bulletins ont été déposés : la liste est verrouillée. Réinitialisez les votes pour la modifier.');
    const entrees = Array.isArray(req.classes) ? req.classes : [];
    if (entrees.length > 40) throw ERR('40 classes au maximum.');
    let cseq = c.cseq, eseq = c.eseq;
    const nomsVus = new Set(), gardes = new Set(), nouvelles = [];
    entrees.forEach(en => {
      const nom = propre(en.nom);
      if (!nom) throw ERR('Une classe n’a pas de nom.');
      if (nomsVus.has(cle(nom))) throw ERR('Deux classes portent le nom « ' + nom + ' ».');
      nomsVus.add(cle(nom));
      const groupes = Array.isArray(en.groupes) ? en.groupes : [];
      if (!groupes.length || groupes.length > 8) throw ERR('Classe ' + nom + ' : de 1 à 8 groupes.');
      const ancienne = en.cid ? lireClasse(en.cid) : null;
      const cid = ancienne ? ancienne.cid : ++cseq;
      if (cid >= B * B) throw ERR('Trop de classes créées depuis l’origine : réinitialisez tout.');
      const anciens = {}; if (ancienne) ancienne.eleves.forEach(e => { anciens[cle(e.nom)] = e; });
      const deja = new Set(ancienne ? ancienne.eleves.map(e => e.code) : []);
      const eleves = [], vus = new Set();
      groupes.forEach((g, gi) => (Array.isArray(g.eleves) ? g.eleves : []).forEach(n0 => {
        const n = propre(n0); if (!n) return;
        const k = cle(n);
        if (vus.has(k)) throw ERR('Classe ' + nom + ' : « ' + n + ' » apparaît deux fois (ajoutez l’initiale du prénom pour les distinguer).');
        vus.add(k);
        const ex = anciens[k];
        if (ex) eleves.push({ id: ex.id, nom: n, g: gi, code: ex.code });
        else { const code = nouveauCode(cid, deja); deja.add(code); eleves.push({ id: String(++eseq), nom: n, g: gi, code }); }
      }));
      if (!eleves.length) throw ERR('Classe ' + nom + ' : aucun élève.');
      const cand = {};
      if (ancienne) eleves.forEach(e => { if (ancienne.cand[e.id]) cand[e.id] = ancienne.cand[e.id]; });
      nouvelles.push({ cid, nom, groupes: groupes.map((g, i) => propre(g.nom) || ('Groupe ' + (i + 1))), eleves, cand, emarge: {} });
      gardes.add(cid);
    });
    c.cids.forEach(x => { if (!gardes.has(x.cid)) env.supprimer('c' + x.cid); });
    nouvelles.forEach(sauverClasse);
    c.cids = nouvelles.map(cl => ({ cid: cl.cid, nom: cl.nom }));
    c.cseq = cseq; c.eseq = eseq;
    sauverCfg(c);
    return { ok: true };
  };

  ACTIONS.a_reglages = req => {
    const c = cfg();
    c.titre = propre(req.titre).slice(0, 100) || 'Élection des délégués de classe';
    c.etab = propre(req.etab).slice(0, 100);
    c.annee = propre(req.annee).slice(0, 20);
    c.adjDiff = !!req.adjDiff;
    const lu = k => { const v = req.dates && req.dates[k]; return (v && isFinite(v)) ? Number(v) : null; };
    if (c.tour === 1) {
      const d = { debutCand: lu('debutCand'), finCand: lu('finCand'), debutVote: lu('debutVote'), finVote: lu('finVote') };
      const suite = [d.debutCand, d.finCand, d.debutVote, d.finVote].filter(x => x != null);
      for (let i = 1; i < suite.length; i++) if (suite[i] < suite[i - 1]) throw ERR('Les dates doivent se suivre : ouverture des candidatures, fin des candidatures, début du vote, fin du vote.');
      if (d.debutVote != null && d.finVote != null && d.finVote <= d.debutVote) throw ERR('Le vote doit finir après son début.');
      c.dates = d; c.forcer = null;
    } else {
      const fv = lu('finVote');
      if (fv != null && fv <= maintenant()) throw ERR('La fin du vote doit être dans le futur.');
      c.dates.finVote = fv; c.forcer = null;
    }
    sauverCfg(c);
    return { ok: true };
  };

  ACTIONS.a_forcer = req => {
    const c = cfg(), e = req.etat || null;
    if ([null, 'preparation', 'candidatures', 'attente', 'vote', 'clos'].indexOf(e) < 0) throw ERR('État inconnu.');
    if (aDesVotes(c) && (e === 'preparation' || e === 'candidatures' || e === 'attente')) throw ERR('Des bulletins ont été déposés : on ne revient plus en arrière.');
    if (e === 'vote' && !toutesClasses(c).some(cl => Object.keys(cl.cand).length)) throw ERR('Aucun candidat dans aucune classe : le vote n’a pas d’objet.');
    c.forcer = e;
    sauverCfg(c);
    return { ok: true };
  };

  ACTIONS.a_candidat = req => {
    const c = cfg();
    if (['preparation', 'candidatures', 'attente'].indexOf(etatDe(c, maintenant())) < 0) throw ERR('Les candidatures ne se modifient plus une fois le vote lancé.');
    const cl = lireClasse(req.cid); if (!cl) throw ERR('Classe inconnue.');
    const id = String(req.eleveId), el = eleveDe(cl, id); if (!el) throw ERR('Élève inconnu.');
    if (req.op === 'retirer') delete cl.cand[id];
    else cl.cand[id] = { roles: validerRoles(req.roles), texte: validerTexte(req.texte) };
    sauverClasse(cl);
    return { ok: true };
  };

  ACTIONS.a_resultats = () => {
    const c = cfg(), etat = etatDe(c, maintenant());
    const max = etat === 'clos' ? c.tour : c.tour - 1;
    if (max < 1) throw ERR('Les résultats ne sont communiqués qu’à la clôture du scrutin.');
    const cls = toutesClasses(c), tours = [];
    for (let n = 1; n <= max; n++) tours.push({ n, classes: cls.map(cl => calculer(cl, c, n)) });
    const final = cls.map((cl, i) => {
      const o = { cid: cl.cid, nom: cl.nom, D: null, A: null };
      ['D', 'A'].forEach(sec => {
        for (let n = max; n >= 1; n--) {
          const r = tours[n - 1].classes[i][sec];
          if (r) { o[sec] = { tour: n, elus: r.elus.map(id => r.candidats.find(x => x.id === id)), egalite: r.egalite, provisoire: r.provisoire }; break; }
        }
      });
      return o;
    });
    return { ok: true, clos: etat === 'clos', tourEnCours: c.tour, adjDiff: c.adjDiff, tours, final };
  };

  ACTIONS.a_tour = req => {
    const c = cfg(), t = maintenant();
    if (etatDe(c, t) !== 'clos') throw ERR('Clôturez d’abord le tour en cours.');
    if (c.tour >= 4) throw ERR('4 tours au maximum.');
    const D = unique(req.D), A = unique(req.A);
    if (!D.length && !A.length) throw ERR('Retenez au moins un candidat.');
    const fv = req.finVote ? Number(req.finVote) : null;
    if (fv && fv <= t) throw ERR('La fin du vote doit être dans le futur.');
    c.tour++; c.tours.push({ n: c.tour, D, A });
    c.dates = { debutCand: t - 3, finCand: t - 2, debutVote: t - 1, finVote: fv };
    c.forcer = null;
    sauverCfg(c);
    return { ok: true };
  };

  ACTIONS.a_reinit = req => {
    if (req.confirmation !== 'EFFACER') throw ERR('Tapez EFFACER pour confirmer.');
    const c = cfg();
    toutesClasses(c).forEach(cl => {
      for (let n = 1; n <= c.tour; n++) env.supprimerUrne('u' + n + '_' + cl.cid);
      cl.emarge = {};
      if (req.quoi === 'tout') cl.cand = {};
      sauverClasse(cl);
    });
    c.tour = 1; c.tours = [{ n: 1, D: null, A: null }]; c.forcer = null;
    if (req.quoi === 'tout') c.dates = {};
    sauverCfg(c);
    return { ok: true };
  };

  /* ---------- point d'entrée ---------- */
  function traiter(req) {
    try {
      const a = req && req.action, f = Object.prototype.hasOwnProperty.call(ACTIONS, a) ? ACTIONS[a] : null;
      if (!f) throw ERR('Action inconnue.');
      if (a.indexOf('a_') === 0) verifierMdp(req);
      if (MUTANTES[a]) return env.verrou(() => { if (env.recharger) env.recharger(); return f(req); });
      return f(req);
    } catch (e) {
      if (e && e.metier) return { ok: false, erreur: e.message };
      if (env.journal) env.journal(e);
      return { ok: false, erreur: 'Erreur interne du serveur.' };
    }
  }
  return { traiter };
}


/* ---------- serveur local de démonstration (localStorage) ---------- */
const LOCAL = (function () {
  const mem = {}, P = 'electionDemo:';
  const get = k => { try { return localStorage.getItem(P + k); } catch (e) { return mem[k] == null ? null : mem[k]; } };
  const set = (k, v) => { try { localStorage.setItem(P + k, v); } catch (e) { mem[k] = v; } };
  const del = k => { try { localStorage.removeItem(P + k); } catch (e) { delete mem[k]; } };
  return creerMoteur({
    mdp: 'demo', maintenant: () => Date.now(), pause() {}, verrou: f => f(),
    hasard: () => { const a = new Uint32Array(2); crypto.getRandomValues(a); return (a[0] * 2097152 + (a[1] >>> 11)) / 9007199254740992; },
    lire: k => { const v = get('d:' + k); return v ? JSON.parse(v) : null; }, ecrire: (k, o) => set('d:' + k, JSON.stringify(o)), supprimer: k => del('d:' + k),
    lireUrne: k => { const v = get('u:' + k); return v ? JSON.parse(v) : null; }, ecrireUrne: (k, a) => set('u:' + k, JSON.stringify(a)), supprimerUrne: k => del('u:' + k)
  });
})();

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = ms => ms ? new Date(ms).toLocaleString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : null;
const pct = x => Math.round(x * 100) + ' %';
const versLocal = ms => { if (!ms) return ''; const d = new Date(ms), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const depuisLocal = v => v ? new Date(v).getTime() : null;
const melange = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ETAT_LIB = { preparation: 'En préparation', candidatures: 'Candidatures ouvertes', attente: 'Candidatures closes', vote: 'Vote ouvert', clos: 'Scrutin clos' };
const pastille = e => '<span class="pastille ' + e + '">' + ETAT_LIB[e] + '</span>';
const rolesTxt = r => (r.indexOf('D') >= 0 ? 'Délégué' : '') + (r === 'DA' ? ' et ' : '') + (r.indexOf('A') >= 0 ? (r === 'DA' ? 'adjoint' : 'Adjoint') : '');
const rolesBadges = r => (r.indexOf('D') >= 0 ? '<span class="badge bleu">Délégué</span> ' : '') + (r.indexOf('A') >= 0 ? '<span class="badge or">Adjoint</span>' : '');

function telecharger(nom, lignes) {
  const csv = '﻿' + lignes.map(l => l.map(x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = nom;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

/* ---------- appel du serveur ---------- */
async function appel(action, d) {
  document.body.classList.add('occupe');
  try {
    let r;
    if (DEMO) { await new Promise(ok => setTimeout(ok, 50)); r = LOCAL.traiter(Object.assign({ action }, d)); }
    else {
      let rep;
      try { rep = await fetch(URL_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, d)) }); }
      catch (e) { throw new Error('Impossible de joindre le serveur. Vérifie ta connexion puis réessaie.'); }
      try { r = await rep.json(); } catch (e) { throw new Error('Le serveur n’a pas répondu correctement (le script Google est-il bien déployé en « Tout le monde » ?).'); }
    }
    if (!r.ok) throw new Error(r.erreur || 'Erreur');
    return r;
  } finally { document.body.classList.remove('occupe'); }
}

function vueAccueil() {

    <h1>${esc(i.titre)}</h1>
    <p class="chapo">Chaque classe élit <b>deux délégués</b>, issus de <b>deux groupes différents</b>, et <b>deux adjoints</b>. Découvre les règles du jeu, présente-toi si tu en as envie, puis vote — en secret.</p>
    <p>${pastille(i.etat)} &nbsp; ${esc(phrase)}</p>
  </section>

  <section class="carte" aria-labelledby="hConn">
    <h2 id="hConn">Entrer avec mon code personnel</h2>
    <form data-form="connexion" autocomplete="off">
      <label class="champ">Mon code (8 signes, remis par mon professeur)
        <input id="code" class="code-saisie" type="text" inputmode="text" maxlength="12" placeholder="XXXX-XXXX" autocapitalize="characters" spellcheck="false" value="${esc(S.code)}" required></label>
      <div class="rangee"><button class="bouton" type="submit">Entrer</button><span class="aide">Ce code est à toi seul : ne le prête à personne, même pour « aider ».</span></div>
    </form>
  </section>

  <section class="carte" id="regles">
    <p class="kicker">Les règles du jeu</p>
    <h2>Une élection, c’est de la démocratie en petit</h2>
    <p>Dans les lycées publics, chaque classe élit ses délégués pour l’année scolaire : ils sont choisis par les élèves de la classe, au scrutin uninominal à deux tours. Voici les principes que nous respectons ici.</p>
    <div class="grille">
      <div class="principe"><h3>Une personne, une voix</h3><p>Tous les élèves de la classe votent. Chacun dispose d’un seul bulletin, qu’il ne peut déposer qu’une fois.</p></div>
      <div class="principe"><h3>Le vote est secret</h3><p>Personne ne saura pour qui tu as voté, pas même ton professeur. Ton nom est seulement coché sur la liste des votants ; ton bulletin tombe dans l’urne sans nom ni heure.</p></div>
      <div class="principe"><h3>Le vote est libre et personnel</h3><p>Tu ne subis aucune pression et tu ne votes jamais à la place d’un autre. Voter blanc est un droit.</p></div>
      <div class="principe"><h3>Candidature ouverte à tous</h3><p>Chacun peut se présenter, quel que soit son niveau ou ses amis. On lit et on écoute toutes les candidatures avec le même respect.</p></div>
      <div class="principe"><h3>Deux groupes, deux voix</h3><p>Les deux délégués viennent de deux groupes différents, pour que chaque groupe de la classe soit représenté.</p></div>
      <div class="principe"><h3>Le résultat s’impose à tous</h3><p>Sont élus ceux qui obtiennent le plus de voix. En cas d’égalité, un tour de plus les départage. On respecte le résultat, même s’il ne nous plaît pas.</p></div>
    </div>
  </section>

  <section class="carte cols" id="roles">
    <p class="kicker">Les rôles</p>
    <h2>Délégué, adjoint : à quoi ça sert ?</h2>
    <div class="grille deux">
      <div>
        <h3><span class="badge bleu">Délégué</span> la voix de la classe</h3>
        <ul class="puces">
          <li>Il porte la parole de la classe : questions, difficultés, idées, projets.</li>
          <li>Il représente ses camarades au <b>conseil de classe</b> et fait le lien avec les professeurs, la vie scolaire et la direction.</li>
          <li>Il participe à l’assemblée des délégués, qui désigne les représentants des élèves dans les instances du lycée.</li>
          <li>Il rend compte à la classe de ce qui a été dit et décidé.</li>
        </ul>
      </div>
      <div>
        <h3><span class="badge or">Adjoint</span> le second de la classe</h3>
        <ul class="puces">
          <li>Il <b>remplace</b> le délégué quand celui-ci est absent ou démissionne.</li>
          <li>Il prépare les réunions avec lui : recueillir les remarques, répartir les tâches.</li>
          <li>Il est un relais de plus : certains élèves lui parlent plus facilement.</li>
          <li>Il se forme au rôle de délégué et peut en prendre la relève.</li>
        </ul>
      </div>
    </div>
    <h3>Les qualités d’un bon représentant</h3>
    <div class="rangee">
      ${['À l’écoute', 'Disponible', 'Fiable et ponctuel', 'Juste avec tous', 'Discret quand il le faut', 'Courageux et poli', 'Esprit d’équipe'].map(q => '<span class="badge">' + q + '</span>').join('')}
    </div>
    <p class="aide" style="margin-top:12px">Un délégué n’est ni un « chef de classe », ni un surveillant, ni un juge : il parle <i>pour</i> la classe, pas à sa place. Il n’a pas besoin d’être le meilleur élève, mais il doit être quelqu’un à qui l’on peut faire confiance.</p>
  </section>

  <section class="carte" id="calendrier">
    <p class="kicker">Le calendrier</p>
    <h2>Où en est-on ?</h2>
    ${etapes(i)}
  </section>`;
}

/* =====================================================================
   ESPACE ÉLÈVE
   ===================================================================== */
function vueEleve() {
  const v = S.eleve; if (!v) return '';
  const tete = `<section class="hero"><p class="kicker">${esc(v.eleve.classe)} · ${esc(v.eleve.groupe)}</p><h1>Bonjour ${esc(v.eleve.nom)}</h1><p>${pastille(v.etat)}${v.tour > 1 && v.etat === 'vote' ? ' &nbsp; <span class="badge">Tour ' + v.tour + '</span>' : ''}</p></section>`;
  let corps = '';
  const d = v.dates || {};
  if (v.etat === 'preparation') corps = `<div class="carte"><h2>Les candidatures ne sont pas encore ouvertes</h2><p>${d.debutCand ? 'Elles ouvriront le <b>' + fmt(d.debutCand) + '</b>.' : 'Ton professeur annoncera la date.'} Reviens à ce moment-là avec ton code.</p><p class="aide">En attendant, relis les règles et les rôles sur la page d’accueil et réfléchis : te présenterais-tu ? pour quoi faire ?</p></div>`;
  else if (v.etat === 'candidatures') corps = panneauCandidature(v) + listeCandidats(v);
  else if (v.etat === 'attente') corps = `<div class="carte"><h2>Les candidatures sont closes</h2><p>${d.debutVote ? 'Le vote ouvrira le <b>' + fmt(d.debutVote) + '</b>.' : 'Ton professeur annoncera l’ouverture du vote.'}</p>${v.moi ? '<p>Ta candidature est bien enregistrée (' + esc(rolesTxt(v.moi.roles)) + ').</p>' : ''}</div>` + listeCandidats(v);
  else if (v.etat === 'vote') corps = panneauVote(v);
  else corps = `<div class="carte"><h2>Le scrutin est clos</h2><p>Merci d’avoir participé à la vie de ta classe. Les résultats te seront communiqués par ton professeur.</p></div>`;
  return tete + corps;
}

/* deux délégués de groupes différents : il faut des candidats délégués dans au moins deux groupes */
function manqueDelegues(groupes, cands) {            // cands : [{groupe (nom), roles}]
  const ont = new Set(cands.filter(x => x.roles.indexOf('D') >= 0).map(x => x.groupe));
  const sans = groupes.filter(g => !ont.has(g));
  return ont.size >= 2 ? '' : '<div class="note"><b>Attention :</b> les deux délégués devant venir de deux groupes différents, il faut des candidats délégués dans <b>au moins deux groupes</b>. Pour l’instant, aucun candidat délégué dans : <b>' + sans.map(esc).join(', ') + '</b>.</div>';
}
function listeCandidats(v) {
  const c = v.candidats;
  return `<section class="carte"><h2>Les candidats de ma classe <span class="badge">${c.length}</span></h2>${v.etat === 'candidatures' ? manqueDelegues(v.groupes, c) : ''}${c.length ? '<div class="grille">' + c.map(x =>
    `<div class="cand"><b>${esc(x.nom)}</b> <span class="badge">${esc(x.groupe)}</span><div style="margin-top:6px">${rolesBadges(x.roles)}</div><p>${x.texte ? esc(x.texte) : '<i>Pas de message.</i>'}</p></div>`).join('') + '</div>'
    : '<p class="aide">Personne ne s’est encore présenté dans ta classe.</p>'}</section>`;
}

function panneauCandidature(v) {
  const m = v.moi, d = v.dates || {};
  return `<section class="carte"><h2>${m ? 'Ma candidature' : 'Je me présente ?'}</h2>
    <p>${d.finCand ? 'Tu peux te présenter ou te retirer jusqu’au <b>' + fmt(d.finCand) + '</b>.' : 'Les candidatures sont ouvertes.'} Présenter sa candidature, c’est proposer de rendre service à la classe.</p>
    <form data-form="candidater">
      <fieldset style="border:0;padding:0;margin:0 0 12px"><legend class="aide" style="padding:0;margin-bottom:6px">Pour quel rôle ? (un seul, ou les deux)</legend>
        <label style="margin-right:18px"><input type="checkbox" name="roles" value="D" ${!m || m.roles.indexOf('D') >= 0 ? 'checked' : ''}> Délégué</label>
        <label><input type="checkbox" name="roles" value="A" ${m && m.roles.indexOf('A') >= 0 ? 'checked' : ''}> Adjoint</label></fieldset>
      <label class="champ">Mon message à la classe (300 caractères) — pourquoi je me présente, ce que je ferai
        <textarea id="texte" maxlength="300" placeholder="Ex. : J’aime écouter les autres et je veux que chacun puisse s’exprimer. Je serai disponible à la récré pour recueillir vos remarques.">${esc(m ? m.texte : '')}</textarea></label>
      <div class="rangee"><button class="bouton" type="submit">${m ? 'Mettre à jour ma candidature' : 'Je me présente'}</button>
      ${m ? '<button class="bouton sec" type="button" data-act="retirerCand">Retirer ma candidature</button>' : ''}</div>
    </form></section>`;
}

function panneauVote(v) {
  if (v.aVote || S.bull.fini) return `<section class="carte"><h2>✔ Ton vote est enregistré</h2><p>Merci ! Ton bulletin est dans l’urne, sans ton nom et sans l’heure : <b>personne ne peut savoir pour qui tu as voté</b>.</p><p class="aide">Seule ta participation (« a voté ») est notée, comme l’émargement dans un bureau de vote.</p><button class="bouton" data-act="quitter">Me déconnecter</button></section>`;
  if (!v.scrutin) return `<section class="carte"><h2>Pas de vote pour ta classe</h2><p>${v.tour > 1 ? 'Ta classe n’a pas de second tour.' : 'Aucun élève ne s’est présenté dans ta classe.'} Ton professeur te dira la suite.</p></section>`;
  const sec = v.sections, o = S.ordre;
  const rub = (k, titre, aide) => {
    if (!sec[k] || !sec[k].length) return '';
    const par = {}; sec[k].forEach(x => par[x.id] = x);
    return `<fieldset class="rub"><legend>${titre}</legend><p class="aide">${aide}</p>` + o[k].map(id => par[id]).filter(Boolean).map(x =>
      `<label class="choix" data-choix="${k}:${x.id}"><input type="checkbox" data-b="${k}" value="${x.id}" data-g="${x.g}"><span><span class="nom">${esc(x.nom)}</span><span class="badge grp">${esc(x.groupe)}</span></span>${x.texte ? '<span class="txt">' + esc(x.texte) + '</span>' : ''}</label>`).join('') + '</fieldset>';
  };
  if (S.bull.etape === 'verif') {
    const nom = (k, id) => { const x = sec[k].find(y => y.id === id); return esc(x.nom) + ' <span class="badge">' + esc(x.groupe) + '</span>'; };
    const ligne = (k, t) => sec[k] && sec[k].length ? '<li><b>' + t + ' :</b> ' + (S.bull[k].length ? S.bull[k].map(id => nom(k, id)).join(' et ') : '<i>vote blanc</i>') + '</li>' : '';
    return `<section class="carte"><h2>Vérifie ton bulletin</h2><ul class="resume">${ligne('D', 'Délégués')}${ligne('A', 'Adjoints')}</ul>
      <div class="note"><b>Attention :</b> une fois déposé, le bulletin ne peut plus être modifié.</div>
      <div class="rangee"><button class="bouton" data-act="deposer">Je dépose mon bulletin</button><button class="bouton sec" data-act="modifierBull">← Modifier</button></div></section>`;
  }
  return `<section class="carte"><h2>Mon bulletin de vote</h2>
    <div class="secret">🔒 <span>Vote secret : ton nom ne sera jamais associé à tes choix. Tu peux ne rien cocher pour voter blanc.</span></div>
    ${rub('D', 'Délégués — jusqu’à 2 noms', 'Choisis jusqu’à <b>deux</b> candidats, qui doivent venir de <b>deux groupes différents</b>. Les noms sont dans un ordre tiré au hasard.')}
    ${rub('A', 'Adjoints — jusqu’à 2 noms', 'Choisis jusqu’à <b>deux</b> candidats' + (v.adjDiff ? ', de <b>deux groupes différents</b>' : '') + '. Les noms sont dans un ordre tiré au hasard.')}
    <p id="msgBull" class="aide" aria-live="polite"></p>
    <button class="bouton" data-act="verifier">Vérifier mon bulletin →</button></section>`;
}

function majBulletin() {
  const sec = S.eleve.sections; if (!sec) return;
  ['D', 'A'].forEach(k => {
    const boites = [...document.querySelectorAll('input[data-b="' + k + '"]')];
    boites.forEach(b => { b.checked = S.bull[k].indexOf(b.value) >= 0; });
    const choisis = boites.filter(b => b.checked), diff = k === 'D' || S.eleve.adjDiff;
    boites.forEach(b => {
      let off = false;
      if (!b.checked) { if (choisis.length >= 2) off = true; else if (diff && choisis.length === 1 && choisis[0].dataset.g === b.dataset.g) off = true; }
      b.disabled = off;
      const l = b.closest('.choix'); l.classList.toggle('sel', b.checked); l.classList.toggle('dis', off);
    });
  });
  const m = $('#msgBull');
  if (m) m.textContent = (S.bull.D.length === 1 ? 'Délégués : tu as choisi un nom ; les candidats de son groupe sont grisés. ' : '') || '';
}
