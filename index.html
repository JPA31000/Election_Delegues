   ===================================================================== */
function vueProfEntree() {
  return `<section class="carte" style="max-width:460px;margin:30px auto"><h2>Espace enseignant</h2>
    <form data-form="profConnexion"><label class="champ">Mot de passe<input id="mdp" type="password" autocomplete="current-password" required autofocus></label>
    <div class="rangee"><button class="bouton" type="submit">Se connecter</button></div></form>
    ${DEMO ? '<p class="aide" style="margin-top:12px">Mode démonstration : le mot de passe est <b>demo</b>.</p>' : ''}</section>`;
}

async function profCharger() {
  const r = await appel('a_etat', { mdp: S.prof.mdp });
  S.prof.d = r;
  if (!S.prof.ed) S.prof.ed = editeurDepuis(r);
}
function editeurDepuis(r) {
  return r.classes.map(c => ({ cid: c.cid, nom: c.nom, groupes: c.groupes.map((nom, gi) => ({ nom, texte: c.eleves.filter(e => e.g === gi).map(e => e.nom).join('\n') })) }));
}

function vueProf() {
  const P = S.prof, d = P.d;
  const onglets = [['bord', 'Tableau de bord'], ['classes', 'Classes et élèves'], ['cal', 'Calendrier et réglages'], ['cand', 'Candidatures'], ['suivi', 'Participation'], ['res', 'Résultats']];
  let corps = '';
  if (P.onglet === 'bord') corps = profBord();
  else if (P.onglet === 'classes') corps = profClasses();
  else if (P.onglet === 'cal') corps = profCal();
  else if (P.onglet === 'cand') corps = profCand();
  else if (P.onglet === 'suivi') corps = profSuivi();
  else corps = profRes();
  return `<div class="rangee" style="justify-content:space-between;margin-bottom:6px"><h1 style="margin:0;font-size:1.6rem">Espace enseignant</h1><span>${pastille(d.etat)}${d.config.tour > 1 ? ' <span class="badge">Tour ' + d.config.tour + '</span>' : ''}</span></div>
    <div class="onglets noprint" role="tablist">${onglets.map(o => '<button role="tab" data-act="onglet" data-o="' + o[0] + '" aria-selected="' + (P.onglet === o[0]) + '">' + o[1] + '</button>').join('')}</div>${corps}`;
}

/* ----- tableau de bord ----- */
function profBord() {
  const d = S.prof.d, c = d.config, nbEl = d.classes.reduce((s, x) => s + x.eleves.length, 0), nbCand = d.classes.reduce((s, x) => s + x.cand.length, 0);
  const cal = c.dates || {};
  const act = (e, t, cls) => '<button class="bouton ' + (cls || '') + '" data-act="forcer" data-e="' + e + '">' + t + '</button>';
  let boutons = '';
  if (d.etat === 'preparation') boutons = act('candidatures', 'Ouvrir les candidatures maintenant');
  else if (d.etat === 'candidatures') boutons = act('attente', 'Clore les candidatures', 'sec') + act('vote', 'Lancer le vote maintenant');
  else if (d.etat === 'attente') boutons = act('vote', 'Lancer le vote maintenant') + (d.verrou ? '' : act('candidatures', 'Rouvrir les candidatures', 'sec'));
  else if (d.etat === 'vote') boutons = act('clos', 'Clore le scrutin maintenant', 'danger');
  else boutons = '<button class="bouton" data-act="onglet" data-o="res">Voir les résultats</button>';
  if (c.forcer) boutons += '<button class="bouton sec" data-act="forcer" data-e="">Suivre le calendrier</button>';
  const tour = c.tour;
  let part = '';
  if (d.etat === 'vote' || d.etat === 'clos') {
    const act1 = d.classes.filter(x => x.scrutin), ins = act1.reduce((s, x) => s + x.eleves.length, 0), vot = act1.reduce((s, x) => s + x.eleves.filter(e => e.votes.indexOf(tour) >= 0).length, 0);
    part = `<div class="carte"><h2>Participation${tour > 1 ? ' — tour ' + tour : ''}</h2><div class="statistiques"><div><span class="chiffre">${vot}</span><small>ont voté</small></div><div><span class="chiffre">${ins}</span><small>inscrits</small></div><div><span class="chiffre">${ins ? pct(vot / ins) : '—'}</span><small>de participation</small></div></div></div>`;
  }
  const ok = b => b ? '✅' : '⬜';
  return `<div class="carte"><h2>Où en est l’élection ?</h2>
    <p>${pastille(d.etat)}${c.forcer ? ' <span class="badge or">forcé à la main</span>' : ''}</p>
    <div class="rangee">${boutons}</div>
    ${d.etat === 'vote' ? '<p class="aide" style="margin-top:10px">Les résultats restent invisibles tant que le scrutin n’est pas clos.</p>' : ''}</div>
    ${part}
    <div class="carte"><h2>Avant de lancer</h2><ul style="list-style:none;padding:0;margin:0;line-height:2">
      <li>${ok(d.classes.length)} <b>Classes et élèves</b> : ${d.classes.length} classe(s), ${nbEl} élève(s) <button class="lien" data-act="onglet" data-o="classes">modifier</button></li>
      <li>${ok(d.classes.length)} <b>Codes personnels</b> générés <button class="lien" data-act="imprCodes">imprimer les fiches</button> <button class="lien" data-act="csvCodes">exporter (CSV)</button></li>
      <li>${ok(cal.debutCand)} <b>Calendrier</b> ${cal.debutCand ? '(candidatures dès le ' + fmt(cal.debutCand) + ')' : 'à fixer'} <button class="lien" data-act="onglet" data-o="cal">régler</button></li>
      <li>${ok(nbCand)} <b>Candidats</b> : ${nbCand} <button class="lien" data-act="onglet" data-o="cand">voir</button></li></ul>
      ${d.verrou ? '<div class="note">Des bulletins sont déposés : la liste des élèves est verrouillée.</div>' : ''}</div>
    ${DEMO ? profDemo() : ''}`;
}

function profDemo() {
  return `<div class="carte"><h2>Outils de démonstration</h2><p class="aide">Pour essayer l’application sans rien saisir : classes fictives, candidatures, votes simulés. Disponible seulement dans ce mode.</p>
    <div class="rangee"><button class="bouton sec" data-act="demoCharger">1 · Créer 2 classes d’exemple + candidats</button><button class="bouton sec" data-act="demoVotes">2 · Simuler des votes (vote ouvert)</button></div></div>`;
}

/* ----- classes et élèves ----- */
function profClasses() {
  const P = S.prof, d = P.d, ed = P.ed, verrou = d.verrou;
  const nbLignes = t => t.split('\n').filter(x => x.trim()).length;
  return `<div class="carte"><h2>Classes, groupes et élèves</h2>
    <p>Donnez le nom de chaque classe, le nombre de groupes, puis collez la liste des élèves de chaque groupe (<b>un élève par ligne</b>, « NOM Prénom »). Chaque élève reçoit un <b>code personnel</b> de 8 signes.</p>
    ${verrou ? '<div class="note">🔒 Des bulletins sont déposés : la liste est verrouillée (réinitialisez les votes dans « Calendrier et réglages » pour la modifier).</div>' : ''}
    <div id="editeur">${ed.map((c, ci) => `<div class="ed-classe" data-ci="${ci}">
      <div class="rangee" style="margin-bottom:10px"><label class="champ" style="flex:1;min-width:150px;margin:0">Classe<input type="text" data-m="nom" value="${esc(c.nom)}" ${verrou ? 'disabled' : ''}></label>
        <label class="champ" style="width:130px;margin:0">Nombre de groupes<select data-m="nbg" ${verrou ? 'disabled' : ''}>${[1, 2, 3, 4, 5, 6, 7, 8].map(n => '<option' + (n === c.groupes.length ? ' selected' : '') + '>' + n + '</option>').join('')}</select></label>
        ${verrou ? '' : '<button class="bouton sec petit" data-act="suppClasse" data-ci="' + ci + '">Supprimer la classe</button>'}</div>
      <div class="grille">${c.groupes.map((g, gi) => `<div><label class="champ" style="margin-bottom:6px">Groupe ${gi + 1} — nom<input type="text" data-m="gnom" data-gi="${gi}" value="${esc(g.nom)}" ${verrou ? 'disabled' : ''}></label>
        <textarea data-m="gtexte" data-gi="${gi}" placeholder="DUPONT Léa&#10;MARTIN Hugo&#10;…" ${verrou ? 'disabled' : ''} aria-label="Élèves du groupe ${gi + 1}">${esc(g.texte)}</textarea><small class="aide" data-nb>${nbLignes(g.texte)} élève(s)</small></div>`).join('')}</div></div>`).join('')}
    ${ed.length ? '' : '<p class="aide">Aucune classe pour l’instant.</p>'}</div>
    ${verrou ? '' : `<div class="rangee"><button class="bouton sec" data-act="ajoutClasse">+ Ajouter une classe</button><button class="bouton" data-act="enregClasses">Enregistrer les classes et générer les codes</button></div>
    <details class="plie"><summary>Coller un tableau depuis Excel / Pronote</summary>
      <p class="aide">Une ligne par élève : <code>Classe ; Groupe ; NOM Prénom</code> (séparés par une tabulation ou un point-virgule). Le groupe peut être un numéro (1, 2, 3…) ou un nom. Sans groupe : <code>Classe ; NOM Prénom</code> (groupe 1).</p>
      <textarea id="importTab" placeholder="2EMNB1;1;DUPONT Léa&#10;2EMNB1;2;MARTIN Hugo"></textarea>
      <div class="rangee" style="margin-top:8px"><button class="bouton sec" data-act="importer">Ajouter à la liste ci-dessus</button></div></details>`}</div>
    ${d.classes.length ? `<div class="carte"><h2>Fiches de codes</h2><p>Imprimez les fiches, découpez-les et remettez-en une à chaque élève <b>en main propre</b>. Une fiche perdue ? Le code reste le même : vous pouvez la réimprimer.</p>
      <div class="rangee"><button class="bouton" data-act="imprCodes">Imprimer les fiches</button><button class="bouton sec" data-act="csvCodes">Exporter en CSV</button></div></div>` : ''}`;
}

/* ----- calendrier et réglages ----- */
function profCal() {
  const d = S.prof.d, c = d.config, dt = c.dates || {}, t1 = c.tour === 1;
  const champ = (k, t, off) => `<label class="champ">${t}<input type="datetime-local" id="d_${k}" value="${versLocal(dt[k])}" ${off ? 'disabled' : ''}></label>`;
  return `<div class="carte"><h2>Calendrier</h2>
    <p>Les phases changent <b>toutes seules</b> aux dates indiquées. Vous pouvez aussi les forcer à la main depuis le tableau de bord.</p>
    ${t1 ? '' : '<div class="note">Un tour supplémentaire est en cours : seule la fin du vote est modifiable.</div>'}
    <form data-form="reglages">
      <div class="grille">${champ('debutCand', 'Ouverture des candidatures', !t1)}${champ('finCand', 'Fin des candidatures', !t1)}${champ('debutVote', 'Début du vote', !t1)}${champ('finVote', 'Fin du vote (le scrutin se clôt seul)', false)}</div>
      <h3 style="margin-top:14px">Réglages</h3>
      <div class="grille deux"><label class="champ">Titre<input type="text" id="r_titre" value="${esc(c.titre)}" maxlength="100"></label>
        <label class="champ">Établissement<input type="text" id="r_etab" value="${esc(c.etab)}" maxlength="100" placeholder="Lycée Urbain Vitry"></label>
        <label class="champ">Année scolaire<input type="text" id="r_annee" value="${esc(c.annee)}" maxlength="20"></label></div>
      <label style="display:flex;gap:10px;align-items:center;margin:6px 0 14px"><input type="checkbox" id="r_adj" ${c.adjDiff ? 'checked' : ''}> Les deux adjoints doivent aussi venir de deux groupes différents</label>
      <button class="bouton" type="submit">Enregistrer</button></form></div>
    <div class="carte"><h2 style="color:var(--rouge)">Zone sensible</h2>
      <p>Repartir de zéro après des essais, ou pour une nouvelle élection. Les classes et les codes sont conservés.</p>
      <details class="plie"><summary>Effacer les votes</summary><p class="aide">Supprime tous les bulletins et les émargements ; garde les candidatures et le calendrier. Tour 1 de nouveau.</p>
        <div class="rangee"><input type="text" id="conf1" placeholder="Tapez EFFACER" style="max-width:200px"><button class="bouton danger" data-act="reinit" data-q="votes">Effacer les votes</button></div></details>
      <details class="plie"><summary>Tout effacer (candidatures, votes, calendrier)</summary><p class="aide">Nouvelle élection avec les mêmes classes.</p>
        <div class="rangee"><input type="text" id="conf2" placeholder="Tapez EFFACER" style="max-width:200px"><button class="bouton danger" data-act="reinit" data-q="tout">Tout effacer</button></div></details></div>`;
}

/* ----- candidatures ----- */
function profCand() {
  const d = S.prof.d, modif = ['preparation', 'candidatures', 'attente'].indexOf(d.etat) >= 0;
  if (!d.classes.length) return '<div class="carte"><p>Saisissez d’abord les classes.</p></div>';
  return d.classes.map(c => {
    const liste = c.cand.map(x => ({ x, e: c.eleves.find(e => e.id === x.id) })).sort((a, b) => a.e.nom.localeCompare(b.e.nom, 'fr'));
    return `<div class="carte"><h2>${esc(c.nom)} <span class="badge">${liste.length} candidat(s)</span></h2>
      ${manqueDelegues(c.groupes, liste.map(({ x, e }) => ({ groupe: c.groupes[e.g], roles: x.roles })))}
      ${liste.length ? '<div class="tableau"><table><thead><tr><th>Élève</th><th>Groupe</th><th>Rôles</th><th>Message</th><th></th></tr></thead><tbody>' + liste.map(({ x, e }) =>
        `<tr><td><b>${esc(e.nom)}</b></td><td>${esc(c.groupes[e.g])}</td><td>${rolesBadges(x.roles)}</td><td>${esc(x.texte)}</td><td>${modif ? '<button class="bouton sec petit" data-act="candRetirer" data-cid="' + c.cid + '" data-id="' + e.id + '">Retirer</button>' : ''}</td></tr>`).join('') + '</tbody></table></div>' : '<p class="aide">Aucun candidat pour l’instant.</p>'}
      ${modif ? `<details class="plie"><summary>Ajouter / modifier un candidat à la main</summary>
        <div class="grille deux" data-cid="${c.cid}"><label class="champ">Élève<select data-f="el">${c.groupes.map((g, gi) => '<optgroup label="' + esc(g) + '">' + c.eleves.filter(e => e.g === gi).map(e => '<option value="' + e.id + '">' + esc(e.nom) + '</option>').join('') + '</optgroup>').join('')}</select></label>
          <div><span class="aide">Rôles</span><br><label><input type="checkbox" data-f="D" checked> Délégué</label> &nbsp; <label><input type="checkbox" data-f="A"> Adjoint</label></div></div>
        <label class="champ">Message (facultatif)<textarea data-f="tx" maxlength="300" style="min-height:60px"></textarea></label>
        <button class="bouton sec" data-act="candAjouter" data-cid="${c.cid}">Enregistrer ce candidat</button></details>` : ''}</div>`;
  }).join('');
}

/* ----- participation ----- */
function profSuivi() {
  const P = S.prof, d = P.d; if (!d.classes.length) return '<div class="carte"><p>Saisissez d’abord les classes.</p></div>';
  const tour = P.tourSuivi || d.config.tour;
  const tours = d.config.tours.map(x => x.n);
  let tot = 0, vot = 0;
  const cartes = d.classes.map(c => {
    const em = c.eleves.map(e => ({ e, v: e.votes.indexOf(tour) >= 0 }));
    const tr = d.config.tours[tour - 1];
    const joue = tour === d.config.tour ? c.scrutin : (em.some(x => x.v));
    if (!joue) return `<div class="carte"><h2>${esc(c.nom)}</h2><p class="aide">Pas de scrutin dans cette classe à ce tour.</p></div>`;
    const nv = em.filter(x => x.v).length; tot += em.length; vot += nv;
    const parG = c.groupes.map((g, gi) => { const l = em.filter(x => x.e.g === gi), n = l.filter(x => x.v).length; return `<tr><td>${esc(g)}</td><td class="n">${n} / ${l.length}</td><td style="width:40%"><div class="barre vert"><i style="width:${l.length ? n / l.length * 100 : 0}%"></i></div></td><td class="n">${l.length ? pct(n / l.length) : '—'}</td></tr>`; }).join('');
    const trie = l => l.sort((a, b) => a.e.nom.localeCompare(b.e.nom, 'fr'));
    return `<div class="carte"><h2>${esc(c.nom)} <span class="badge ${nv === em.length ? 'vert' : ''}">${nv} / ${em.length} · ${pct(nv / em.length)}</span></h2>
      <div class="barre vert" style="margin-bottom:12px"><i style="width:${nv / em.length * 100}%"></i></div>
      <div class="tableau"><table><tbody>${parG}</tbody></table></div>
      <details class="plie" open><summary>Liste nominative (${nv} ont voté · ${em.length - nv} pas encore)</summary>
        <h3 style="margin-top:10px">Ont voté</h3><div>${trie(em.filter(x => x.v)).map(x => '<span class="puce-eleve a-vote">' + esc(x.e.nom) + '</span>').join('') || '<span class="aide">personne</span>'}</div>
        <h3 style="margin-top:10px">N’ont pas encore voté</h3><div>${trie(em.filter(x => !x.v)).map(x => '<span class="puce-eleve">' + esc(x.e.nom) + '</span>').join('') || '<span class="aide">tout le monde a voté 🎉</span>'}</div></details></div>`;
  }).join('');
  return `<div class="carte"><div class="rangee" style="justify-content:space-between"><h2 style="margin:0">Participation</h2>
      <div class="rangee noprint">${tours.length > 1 ? '<label>Tour <select data-act="tourSuivi">' + tours.map(n => '<option' + (n === tour ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label>' : ''}
      <button class="bouton sec petit" data-act="rafraichir">↻ Actualiser</button><button class="bouton sec petit" data-act="csvSuivi">Exporter (CSV)</button><button class="bouton sec petit" data-act="imprimer">Imprimer</button></div></div>
    <p class="aide">Seule la participation est visible. Le contenu des bulletins n’est lié à aucun nom.</p>
    <div class="statistiques"><div><span class="chiffre">${vot}</span><small>ont voté</small></div><div><span class="chiffre">${tot}</span><small>inscrits</small></div><div><span class="chiffre">${tot ? pct(vot / tot) : '—'}</span><small>de participation</small></div></div></div>${cartes}`;
}

/* ----- résultats ----- */
function profRes() {
  const P = S.prof;
  if (!P.res) return '<div class="carte"><p>Chargement…</p></div>';
  if (P.res.erreur) return `<div class="carte"><h2>Résultats</h2><p>${esc(P.res.erreur)}</p><p class="aide">Ils apparaîtront ici après la clôture du scrutin (bouton « Clore le scrutin » ou date de fin atteinte).</p></div>`;
  const R = P.res, sel = P.resTour || 'final';
  const barre = ['final'].concat(R.tours.map(t => t.n));
  let corps = '';
  if (sel === 'final') corps = resSynthese(R);
  else corps = R.tours.find(t => t.n === sel).classes.map(c => resClasse(c)).join('');
  const dernier = R.tours[R.tours.length - 1].n, peutTour = R.clos && R.tourEnCours === dernier && dernier < 4;
  return `<div class="carte noprint"><div class="rangee" style="justify-content:space-between"><div class="rangee">${barre.map(b => '<button class="bouton ' + (b === sel ? '' : 'sec') + ' petit" data-act="resTour" data-t="' + b + '">' + (b === 'final' ? 'Synthèse' : 'Tour ' + b) + '</button>').join('')}</div>
    <div class="rangee"><button class="bouton sec petit" data-act="csvRes">Exporter (CSV)</button><button class="bouton sec petit" data-act="imprimer">Imprimer</button>${peutTour ? '<button class="bouton petit" data-act="ouvrirTour">Organiser un tour de plus…</button>' : ''}</div></div></div>${corps}
    <dialog id="dlgTour"></dialog>`;
}

function nomElu(x) { return x ? esc(x.nom) + ' <span class="aide">(' + esc(x.groupe) + ')</span>' : '—'; }
function resSynthese(R) {
  const ligne = f => {
    const cell = k => {
      const o = f[k]; if (!o) return '<span class="aide">pas de candidat</span>';
      let h = o.elus.map(x => '<div>' + nomElu(x) + '</div>').join('');
      if (o.egalite) h += '<div class="badge rouge">égalité : ' + o.egalite.candidats.map(x => esc(x.nom)).join(' / ') + '</div>';
      else if (o.elus.length < 2) h += '<div class="badge or">siège vacant</div>';
      if (o.provisoire) h += '<div class="badge or">provisoire</div>';
      return h + (o.tour > 1 ? '<div class="aide">tour ' + o.tour + '</div>' : '');
    };
    return '<tr><td><b>' + esc(f.nom) + '</b></td><td>' + cell('D') + '</td><td>' + cell('A') + '</td></tr>';
  };
  const alertes = R.final.some(f => (f.D && f.D.egalite) || (f.A && f.A.egalite));
  return `<div class="carte"><h2>Élus de chaque classe</h2>
    ${alertes ? '<div class="note"><b>Égalité(s) à départager.</b> Bouton « Organiser un tour de plus… » : seuls les candidats retenus se représentent.</div>' : ''}
    <div class="tableau"><table><thead><tr><th>Classe</th><th>Délégués</th><th>Adjoints</th></tr></thead><tbody>${R.final.map(ligne).join('')}</tbody></table></div>
    <p class="aide">Les deux délégués sont les mieux placés, de deux groupes différents${R.adjDiff ? ' ; les adjoints suivent la même règle' : ''}. Un candidat élu délégué ne peut pas être adjoint.</p></div>`;
}
function resClasse(c) {
  if (!c.scrutin) return `<div class="carte"><h2>${esc(c.nom)}</h2><p class="aide">Pas de scrutin dans cette classe à ce tour.</p></div>`;
  const sec = (t, S_) => {
    if (!S_) return '';
    return `<h3 style="margin-top:14px">${t}${S_.provisoire ? ' <span class="badge or">provisoire</span>' : ''}</h3><div class="tableau"><table><thead><tr><th>Candidat</th><th>Groupe</th><th class="n">Voix</th><th>% des votants</th><th></th></tr></thead><tbody>${S_.candidats.map(x =>
      `<tr class="${x.elu ? 'elu' : ''}"><td>${esc(x.nom)}</td><td>${esc(x.groupe)}</td><td class="n"><b>${x.v}</b></td><td style="width:26%"><div class="barre ${x.elu ? 'vert' : ''}"><i style="width:${x.pct * 100}%"></i></div></td><td>${x.elu ? '<span class="badge vert">Élu(e)</span>' : x.deja ? '<span class="badge">déjà délégué(e)</span>' : ''}</td></tr>`).join('')}
      <tr><td colspan="2"><i>Blancs (aucun nom)</i></td><td class="n">${S_.blancs}</td><td colspan="2"></td></tr></tbody></table></div>
      ${S_.egalite ? '<div class="note"><b>Égalité</b> pour ' + S_.egalite.places + ' siège(s) : ' + S_.egalite.candidats.map(x => esc(x.nom) + ' (' + x.v + ')').join(', ') + '.</div>' : ''}`;
  };
  return `<div class="carte"><h2>${esc(c.nom)} <span class="badge">${c.bulletins} bulletin(s) / ${c.inscrits} inscrits · ${c.inscrits ? pct(c.bulletins / c.inscrits) : ''}</span></h2>
    ${c.coherent ? '' : '<div class="note">⚠ Écart entre le nombre de bulletins (' + c.bulletins + ') et d’émargements (' + c.emarges + ') : vérifiez avant de proclamer.</div>'}
    ${sec('Délégués', c.D)}${sec('Adjoints', c.A)}</div>`;
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
async function charger() {
  try { S.info = await appel('info'); } catch (e) { S.info = null; flash('err', e.message); }
  rendre();
}
const ACT = {
  accueil() { S.vue = 'accueil'; charger(); },
  profEntree() { S.vue = 'profEntree'; rendre(); },
  async quitter() { S.eleve = null; S.code = ''; S.prof = null; S.ordre = null; S.bull = { D: [], A: [], etape: 'choix', fini: false }; S.vue = 'accueil'; await charger(); },
  async actualiser() { await connecter(S.code, true); },
  async retirerCand() {
    if (!confirm('Retirer ta candidature ?')) return;
    try { S.eleve = await appel('retirer', { code: S.code }); flash('ok', 'Ta candidature est retirée.'); } catch (e) { flash('err', e.message); }
    rendre();
  },
  verifier() { S.bull.etape = 'verif'; rendre(); },
  modifierBull() { S.bull.etape = 'choix'; rendre(); },
  async deposer() {
    try {
      await appel('voter', { code: S.code, delegues: S.bull.D, adjoints: S.bull.A });
      S.bull = { D: [], A: [], etape: 'choix', fini: true };
      S.eleve.aVote = true; S.eleve.sections = null;
    } catch (e) { flash('err', e.message); S.bull.etape = 'choix'; }
    rendre();
  },
  /* --- enseignant --- */
  async onglet(b) {
    S.prof.onglet = b.dataset.o;
    if (b.dataset.o === 'res') { S.prof.res = null; rendre(); try { S.prof.res = await appel('a_resultats', { mdp: S.prof.mdp }); } catch (e) { S.prof.res = { erreur: e.message }; } }
    else if (['bord', 'suivi', 'cand', 'cal'].indexOf(b.dataset.o) >= 0) { try { await profCharger(); } catch (e) { flash('err', e.message); } }
    rendre();
  },
  async rafraichir() { try { await profCharger(); } catch (e) { flash('err', e.message); } rendre(); },
  async forcer(b) {
    const e = b.dataset.e || null;
    if (e === 'clos' && !confirm('Clore le scrutin ? Plus personne ne pourra voter et les résultats deviendront visibles.')) return;
    if (e === 'vote' && !confirm('Lancer le vote maintenant ? Les candidatures ne seront plus modifiables.')) return;
    try { await appel('a_forcer', { mdp: S.prof.mdp, etat: e }); await profCharger(); } catch (er) { flash('err', er.message); }
    rendre();
  },
  ajoutClasse() { S.prof.ed.push({ cid: null, nom: '', groupes: [{ nom: 'Groupe 1', texte: '' }, { nom: 'Groupe 2', texte: '' }] }); rendre(); },
  suppClasse(b) { const c = S.prof.ed[+b.dataset.ci]; if (confirm('Supprimer la classe « ' + (c.nom || 'sans nom') + ' » de la liste ? (Appliqué à l’enregistrement.)')) { S.prof.ed.splice(+b.dataset.ci, 1); rendre(); } },
  async enregClasses() {
    try {
      await appel('a_classes', { mdp: S.prof.mdp, classes: S.prof.ed.map(c => ({ cid: c.cid, nom: c.nom, groupes: c.groupes.map(g => ({ nom: g.nom, eleves: g.texte.split('\n') })) })) });
      S.prof.ed = null; await profCharger(); flash('ok', 'Classes enregistrées. Les codes personnels sont prêts.');
    } catch (e) { flash('err', e.message); }
    rendre();
  },
  importer() {
    const lignes = ($('#importTab').value || '').split('\n').map(l => l.trim()).filter(Boolean);
    const ed = S.prof.ed; let n = 0;
    for (const l of lignes) {
      const p = l.split(/\t|;/).map(x => x.trim());
      if (p.length < 2) { flash('err', 'Ligne illisible : « ' + l + ' »'); rendre(); return; }
      const cn = p[0], nom = p.length >= 3 ? p.slice(2).join(' ') : p[1], gtok = p.length >= 3 ? p[1] : '1';
      let c = ed.find(x => x.nom.toLowerCase() === cn.toLowerCase());
      if (!c) { c = { cid: null, nom: cn, groupes: [{ nom: 'Groupe 1', texte: '' }] }; ed.push(c); }
      let gi = /^\d+$/.test(gtok) ? parseInt(gtok, 10) - 1 : c.groupes.findIndex(g => g.nom.toLowerCase() === gtok.toLowerCase());
      if (gi < 0) { c.groupes.push({ nom: gtok, texte: '' }); gi = c.groupes.length - 1; }
      while (c.groupes.length <= gi && c.groupes.length < 8) c.groupes.push({ nom: 'Groupe ' + (c.groupes.length + 1), texte: '' });
      const g = c.groupes[Math.min(gi, c.groupes.length - 1)]; g.texte += (g.texte && !g.texte.endsWith('\n') ? '\n' : '') + nom; n++;
    }
    flash('info', n + ' élève(s) ajouté(s) à la liste. Pensez à enregistrer.'); rendre();
  },
  async candRetirer(b) { try { await appel('a_candidat', { mdp: S.prof.mdp, op: 'retirer', cid: +b.dataset.cid, eleveId: b.dataset.id }); await profCharger(); } catch (e) { flash('err', e.message); } rendre(); },
  async candAjouter(b) {
    const z = b.closest('details'), cid = +b.dataset.cid, g = s => z.querySelector('[data-f="' + s + '"]');
    const roles = (g('D').checked ? 'D' : '') + (g('A').checked ? 'A' : '');
    try { await appel('a_candidat', { mdp: S.prof.mdp, op: 'ajouter', cid, eleveId: g('el').value, roles, texte: g('tx').value }); await profCharger(); flash('ok', 'Candidat enregistré.'); } catch (e) { flash('err', e.message); }
    rendre();
  },
  tourSuivi(el) { S.prof.tourSuivi = +el.value; rendre(); },
  resTour(b) { S.prof.resTour = b.dataset.t === 'final' ? 'final' : +b.dataset.t; rendre(); },
  imprimer() { window.print(); },
  async reinit(b) {
    const q = b.dataset.q, v = $(q === 'votes' ? '#conf1' : '#conf2').value;
    try { await appel('a_reinit', { mdp: S.prof.mdp, quoi: q, confirmation: v.trim() }); S.prof.ed = null; S.prof.res = null; await profCharger(); flash('ok', 'C’est fait.'); } catch (e) { flash('err', e.message); }
    rendre();
  },
  imprCodes() {
    const d = S.prof.d, base = location.href.split('#')[0].split('?')[0];
    $('#impr').innerHTML = d.classes.map(c => '<h2>' + esc(c.nom) + '</h2>' + c.eleves.map(e => '<div class="carte-code"><b>' + esc(d.config.titre) + '</b><br>' + esc(e.nom) + '<br><span>' + esc(c.nom) + ' · ' + esc(c.groupes[e.g]) + '</span><div class="code">' + e.code.slice(0, 4) + '-' + e.code.slice(4) + '</div><small>Va sur ' + esc(base) + '<br>Ce code est personnel : ne le montre à personne.</small></div>').join('')).join('');
    document.body.dataset.impr = 'codes'; window.print();
  },
  csvCodes() { const d = S.prof.d; telecharger('codes-eleves.csv', [['Classe', 'Groupe', 'Nom', 'Code']].concat(d.classes.flatMap(c => c.eleves.map(e => [c.nom, c.groupes[e.g], e.nom, e.code.slice(0, 4) + '-' + e.code.slice(4)])))); },
  csvSuivi() {
    const d = S.prof.d, t = S.prof.tourSuivi || d.config.tour;
    telecharger('participation-tour' + t + '.csv', [['Classe', 'Groupe', 'Nom', 'A voté (tour ' + t + ')']].concat(d.classes.flatMap(c => c.eleves.map(e => [c.nom, c.groupes[e.g], e.nom, e.votes.indexOf(t) >= 0 ? 'oui' : 'non']))));
  },
  csvRes() {
    const R = S.prof.res, L = [['Tour', 'Classe', 'Rubrique', 'Candidat', 'Groupe', 'Voix', '% des votants', 'Élu(e)']];
    R.tours.forEach(t => t.classes.forEach(c => ['D', 'A'].forEach(k => {
      if (!c[k]) return;
      const rub = k === 'D' ? 'Délégués' : 'Adjoints';
      c[k].candidats.forEach(x => L.push([t.n, c.nom, rub, x.nom, x.groupe, x.v, Math.round(x.pct * 100), x.elu ? 'oui' : '']));
      L.push([t.n, c.nom, rub, '(blancs)', '', c[k].blancs, '', '']);
    })));
    telecharger('resultats.csv', L);
  },
  ouvrirTour() {
    const R = S.prof.res, T = R.tours[R.tours.length - 1], dlg = $('#dlgTour');
    const bloc = (c, k, t) => {
      const S_ = c[k]; if (!S_) return '';
      const pre = new Set(S_.egalite ? S_.egalite.candidats.map(x => x.id).concat(S_.elus) : []);
      return '<h4 style="margin:.6em 0 .2em">' + t + '</h4>' + S_.candidats.filter(x => !x.deja).map(x => '<label style="display:block"><input type="checkbox" data-k="' + k + '" value="' + x.id + '" ' + (pre.has(x.id) ? 'checked' : '') + '> ' + esc(x.nom) + ' <span class="aide">' + esc(x.groupe) + ' · ' + x.v + ' voix</span></label>').join('');
    };
    dlg.innerHTML = `<h2>Organiser un tour de plus</h2><p class="aide">Cochez les candidats qui se représentent. Les rubriques où personne n’est coché ne sont pas revotées (le résultat précédent est conservé). Tout le monde revote, avec les mêmes règles.</p>
      <div style="max-height:46vh;overflow:auto">${T.classes.filter(c => c.scrutin).map(c => '<div class="ed-classe"><b>' + esc(c.nom) + '</b>' + bloc(c, 'D', 'Délégués') + bloc(c, 'A', 'Adjoints') + '</div>').join('')}</div>
      <label class="champ">Fin du vote (facultatif — sinon, vous clorez à la main)<input type="datetime-local" id="tourFin"></label>
      <div class="rangee"><button class="bouton" id="tourOk">Lancer le tour ${R.tourEnCours + 1}</button><button class="bouton sec" id="tourNon">Annuler</button></div>`;
    dlg.showModal();
    $('#tourNon').onclick = () => dlg.close();
    $('#tourOk').onclick = async () => {
      const ids = k => [...dlg.querySelectorAll('input[data-k="' + k + '"]:checked')].map(i => i.value);
      try { await appel('a_tour', { mdp: S.prof.mdp, D: ids('D'), A: ids('A'), finVote: depuisLocal($('#tourFin').value) }); dlg.close(); S.prof.res = null; S.prof.tourSuivi = null; S.prof.resTour = 'final'; S.prof.onglet = 'bord'; await profCharger(); flash('ok', 'Tour supplémentaire lancé : le vote est rouvert.'); }
      catch (e) { dlg.close(); flash('err', e.message); }
      rendre();
    };
  },
  /* --- démonstration --- */
  async demoCharger() {
    const pre = 'Léa Hugo Inès Lucas Chloé Nathan Manon Louis Camille Enzo Jade Théo Sarah Maël Emma Noah Lina Tom Zoé Yanis Alice Ethan Clara Rayan Eva Axel Nora Mathis Lola Adam'.split(' ');
    const nom = 'MARTIN BERNARD DUBOIS THOMAS ROBERT RICHARD PETIT DURAND LEROY MOREAU SIMON LAURENT LEFEBVRE MICHEL GARCIA DAVID BERTRAND ROUX VINCENT FOURNIER MOREL GIRARD ANDRÉ MERCIER DUPONT LAMBERT BONNET FRANÇOIS MARTINEZ LEGRAND'.split(' ');
    const pris = new Set(), gen = n => { const l = []; while (l.length < n) { const x = nom[Math.floor(Math.random() * nom.length)] + ' ' + pre[Math.floor(Math.random() * pre.length)]; if (!pris.has(x)) { pris.add(x); l.push(x); } } return l.join('\n'); };
    S.prof.ed = [{ cid: null, nom: '2EMNB1', groupes: [{ nom: 'Groupe 1', texte: gen(12) }, { nom: 'Groupe 2', texte: gen(12) }] }, { cid: null, nom: '1AA', groupes: [{ nom: 'Groupe 1', texte: gen(9) }, { nom: 'Groupe 2', texte: gen(9) }, { nom: 'Groupe 3', texte: gen(9) }] }];
    try {
      await appel('a_classes', { mdp: 'demo', classes: S.prof.ed.map(c => ({ cid: c.cid, nom: c.nom, groupes: c.groupes.map(g => ({ nom: g.nom, eleves: g.texte.split('\n') })) })) });
      S.prof.ed = null; await profCharger();
      for (const c of S.prof.d.classes) for (const e of melange(c.eleves).slice(0, 6)) await appel('a_candidat', { mdp: 'demo', op: 'ajouter', cid: c.cid, eleveId: e.id, roles: ['D', 'A', 'DA'][Math.floor(Math.random() * 3)], texte: 'Je veux que chacun soit entendu dans la classe.' });
      await profCharger(); flash('ok', 'Exemple créé : 2 classes, 6 candidats chacune. Lancez le vote depuis le tableau de bord, puis simulez des votes.');
    } catch (er) { flash('err', er.message); }
    rendre();
  },
  async demoVotes() {
    try {
      if (S.prof.d.etat !== 'vote') throw new Error('Lancez d’abord le vote depuis le tableau de bord.');
      let n = 0;
      for (const c of S.prof.d.classes) for (const e of c.eleves) {
        if (e.votes.indexOf(S.prof.d.config.tour) >= 0 || Math.random() > .75) continue;
        const v = await appel('connexion', { code: e.code }); if (!v.sections) continue;
        const pick = (l, diff) => { if (!l || !l.length) return []; const m = melange(l), out = []; const k = Math.floor(Math.random() * 3); for (const x of m) { if (out.length >= k) break; if (diff && out.length && out[0].g === x.g) continue; out.push(x); } return out.map(x => x.id); };
        await appel('voter', { code: e.code, delegues: pick(v.sections.D, true), adjoints: pick(v.sections.A, v.adjDiff) }); n++;
      }
      await profCharger(); flash('ok', n + ' vote(s) simulé(s).');
    } catch (er) { flash('err', er.message); }
    rendre();
  }
};

async function connecter(code, silencieux) {
  try {
    S.eleve = await appel('connexion', { code }); S.code = code;
    if (S.eleve.sections) S.ordre = { D: melange((S.eleve.sections.D || []).map(x => x.id)), A: melange((S.eleve.sections.A || []).map(x => x.id)) };
    S.vue = 'eleve'; if (!silencieux) S.bull = { D: [], A: [], etape: 'choix', fini: false };
    if (silencieux) flash('info', 'Mis à jour.');
  } catch (e) { flash('err', e.message); S.vue = S.eleve ? 'eleve' : 'accueil'; }
  rendre();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  if (b.tagName === 'A') e.preventDefault();
  const f = ACT[b.dataset.act]; if (f) f(b, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.b) {                       // case du bulletin
    const k = el.dataset.b, l = S.bull[k], i = l.indexOf(el.value);
    if (el.checked && i < 0) l.push(el.value); else if (!el.checked && i >= 0) l.splice(i, 1);
    majBulletin();
  } else if (el.dataset.act === 'tourSuivi') ACT.tourSuivi(el);
  else if (el.dataset.m === 'nbg') {        // nombre de groupes
    const c = S.prof.ed[+el.closest('[data-ci]').dataset.ci], n = +el.value;
    while (c.groupes.length < n) c.groupes.push({ nom: 'Groupe ' + (c.groupes.length + 1), texte: '' });
    if (c.groupes.length > n) {
      const perdus = c.groupes.slice(n).reduce((s, g) => s + g.texte.split('\n').filter(x => x.trim()).length, 0);
      if (perdus && !confirm(perdus + ' élève(s) des derniers groupes seront retirés de la liste. Continuer ?')) { el.value = c.groupes.length; return; }
      c.groupes.length = n;
    }
    rendre();
  }
});
document.addEventListener('input', e => {
  const el = e.target, m = el.dataset.m; if (!m || m === 'nbg') return;
  const c = S.prof.ed[+el.closest('[data-ci]').dataset.ci];
  if (m === 'nom') c.nom = el.value;
  else if (m === 'gnom') c.groupes[+el.dataset.gi].nom = el.value;
  else if (m === 'gtexte') { c.groupes[+el.dataset.gi].texte = el.value; el.parentElement.querySelector('[data-nb]').textContent = el.value.split('\n').filter(x => x.trim()).length + ' élève(s)'; }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'connexion') { await connecter($('#code').value); }
  else if (f === 'candidater') {
    const roles = [...document.querySelectorAll('input[name=roles]:checked')].map(i => i.value).join('');
    try { S.eleve = await appel('candidater', { code: S.code, roles, texte: $('#texte').value }); flash('ok', 'Ta candidature est enregistrée. Tu peux la modifier ou la retirer jusqu’à la fin des candidatures.'); } catch (er) { flash('err', er.message); }
    rendre();
  } else if (f === 'profConnexion') {
    S.prof = { mdp: $('#mdp').value, onglet: 'bord', d: null, ed: null, res: null };
    try { await profCharger(); S.vue = 'prof'; if (!S.prof.d.classes.length) S.prof.onglet = 'classes'; } catch (er) { S.prof = null; flash('err', er.message); }
    rendre();
  } else if (f === 'reglages') {
    try {
      await appel('a_reglages', { mdp: S.prof.mdp, titre: $('#r_titre').value, etab: $('#r_etab').value, annee: $('#r_annee').value, adjDiff: $('#r_adj').checked,
        dates: { debutCand: depuisLocal($('#d_debutCand').value), finCand: depuisLocal($('#d_finCand').value), debutVote: depuisLocal($('#d_debutVote').value), finVote: depuisLocal($('#d_finVote').value) } });
      S.info = await appel('info'); await profCharger(); flash('ok', 'Réglages enregistrés.');
    } catch (er) { flash('err', er.message); }
    rendre();
  }
});
window.addEventListener('afterprint', () => { delete document.body.dataset.impr; $('#impr').innerHTML = ''; });
setInterval(async () => {                    // le suivi se met à jour tout seul pendant le vote
  if (S.vue === 'prof' && S.prof && S.prof.onglet === 'suivi' && S.prof.d.etat === 'vote' && !document.hidden && !document.activeElement.matches('select,input')) {
    try { await profCharger(); rendre(); } catch (e) {}
  }
}, 30000);

charger();
</script>
